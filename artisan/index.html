<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digital Storefront</title>
    <meta name="description" content="" data-meta-description>
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <meta property="og:type" content="website">
    <meta property="og:title" content="" data-meta-title>
    <meta property="og:description" content="" data-meta-description>
    <meta property="og:image" content="" data-meta-image>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="" data-meta-title>
    <meta name="twitter:description" content="" data-meta-description>
    <meta name="twitter:image" content="" data-meta-image>


    <style>
/* Theme tokens: add a new client look by adding one [data-theme] block. */
:root[data-theme="cyber"] {
  color-scheme: dark;
  --bg: #0a0a0f;
  --hero-from: #12121a;
  --hero-to: #08080c;
  --panel: rgba(24, 24, 32, 0.4);
  --surface: rgba(24, 24, 32, 0.6);
  --surface-hover: rgba(39, 39, 48, 0.75);
  --bar: rgba(9, 9, 13, 0.85);
  --border: #27272f;
  --border-strong: #3f3f4a;
  --text: #f4f4f5;
  --text-muted: #a1a1aa;
  --accent: #38bdf8;
  --accent-hover: #7dd3fc;
  --accent-text: #04121c;
  --accent-soft: rgba(56, 189, 248, 0.12);
  --glow-a: #38bdf8;
  --glow-b: #a855f7;
  --radius: 16px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

:root[data-theme="luxe"] {
  color-scheme: light;
  --bg: #faf7f2;
  --hero-from: #faf7f2;
  --hero-to: #f2ece1;
  --panel: rgba(255, 255, 255, 0.45);
  --surface: rgba(255, 255, 255, 0.72);
  --surface-hover: #ffffff;
  --bar: rgba(255, 255, 255, 0.88);
  --border: #e6dccb;
  --border-strong: #cbbda3;
  --text: #1c1917;
  --text-muted: #6b6459;
  --accent: #b48a3c;
  --accent-hover: #9c742c;
  --accent-text: #ffffff;
  --accent-soft: rgba(180, 138, 60, 0.12);
  --glow-a: #d4af37;
  --glow-b: #8c6b2f;
  --radius: 14px;
  --font: "Cormorant Garamond", "Times New Roman", Georgia, serif;
}

:root[data-theme="artisan"] {
  color-scheme: light;
  --bg: #f5f0e1;
  --hero-from: #f7f2e4;
  --hero-to: #ebe5d5;
  --panel: rgba(255, 255, 255, 0.42);
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: #ffffff;
  --bar: rgba(255, 255, 255, 0.9);
  --border: #e3d9c2;
  --border-strong: #c9b894;
  --text: #1f1b16;
  --text-muted: #6a6152;
  --accent: #c2410c;
  --accent-hover: #9a3412;
  --accent-text: #ffffff;
  --accent-soft: rgba(194, 65, 12, 0.1);
  --glow-a: #f97316;
  --glow-b: #e11d48;
  --radius: 18px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 20px 18px;
  text-align: center;
  background: linear-gradient(140deg, var(--hero-from), var(--hero-to));
  overflow: hidden;
}

.hero__glow {
  position: absolute;
  inset: 0;
  opacity: 0.12;
  pointer-events: none;
}

.hero__glow::before,
.hero__glow::after {
  content: "";
  position: absolute;
  width: 24rem;
  height: 24rem;
  border-radius: 9999px;
  filter: blur(72px);
}

.hero__glow::before {
  top: 0;
  left: 0;
  background: var(--glow-a);
  transform: translate(-50%, -50%);
}

.hero__glow::after {
  right: 0;
  bottom: 0;
  background: var(--glow-b);
  transform: translate(50%, 50%);
}

.hero__inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-width: 34rem;
  min-width: 0;
}

.hero__logo {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent);
  overflow: hidden;
}

.hero__logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero__name {
  margin: 0;
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}

.hero__tagline {
  margin: 0;
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--text-muted);
  overflow-wrap: anywhere;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.82rem;
  color: var(--text-muted);
  text-decoration: none;
  cursor: pointer;
  transition: border-color 0.18s ease, color 0.18s ease;
}

.badge:hover {
  border-color: var(--accent);
  color: var(--text);
}

.badge:hover .badge__icon {
  fill: var(--accent);
}

.badge__icon {
  width: 16px;
  height: 16px;
  fill: var(--text-muted);
  transition: fill 0.18s ease;
}

/* ---------- Catalogue panel ---------- */
.panel {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
  overflow: hidden;
}

.tabs-wrapper {
  margin: 12px auto 0;
  width: min(100%, 32rem);
  flex: 0 0 auto;
}

.tabs-container {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  min-height: 60px;
}

.tabs {
  display: flex;
  gap: 4px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
  scroll-behavior: smooth;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tabs.simple-mode {
  display: flex;
  gap: 4px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs.simple-mode .tab {
  flex: 1 0 auto;
}

.tabs-nav {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease;
  flex: 0 0 auto;
}

.tabs-nav:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.tabs-nav:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.tabs-nav--left {
  margin-left: 0;
}

.tabs-nav--right {
  margin-right: 0;
}

.tab {
  flex: 0 0 auto;
  padding: 9px 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
  white-space: nowrap;
}

.tab[aria-selected="true"] {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 700;
}

.catalogue {
  flex: 1;
  min-height: 0;
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px 18px;
}

.card-list {
  display: grid;
  gap: 10px;
  max-width: 46rem;
  margin: 0 auto;
}

.category-header {
  margin: 20px 0 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  scroll-margin-top: 100px;
}

.category-header--sticky {
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(12px);
}

.card {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  user-select: none;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.12s ease;
}

.card:hover:not([data-sold-out]) {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

.card:has(.card__main:active) {
  transform: scale(0.985);
}

.card[data-selected="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.card[data-sold-out] {
  opacity: 0.45;
}

/* The card's own hit area — the stepper is a sibling, never nested inside it. */
.card__main {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 14px 16px;
  border: 0;
  border-radius: inherit;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.card__main[disabled] {
  cursor: not-allowed;
}

.card__aside {
  display: flex;
  align-items: center;
  padding-right: 14px;
}

.card__body {
  flex: 1;
  min-width: 0;
}

.card__name {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.card[data-selected="true"] .card__name {
  color: var(--accent);
}

.card__desc {
  margin: 3px 0 0;
  font-size: 0.85rem;
  line-height: 1.4;
  color: var(--text-muted);
  overflow-wrap: anywhere;
}

.card__price {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}

.card__check {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 9999px;
  border: 1px solid var(--border-strong);
  color: var(--accent-text);
  font-size: 0.7rem;
  cursor: pointer;
}

.card__check:hover {
  border-color: var(--accent);
}

.card[data-selected="true"] .card__check {
  background: var(--accent);
  border-color: var(--accent);
}

/* Quantity stepper */
.stepper {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 9999px;
  background: var(--bg);
}

.stepper__btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 9999px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}

.stepper__btn:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.stepper__qty {
  min-width: 20px;
  text-align: center;
  font-size: 0.88rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.empty {
  padding: 28px 10px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* ---------- Checkout bar ---------- */
.checkout {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
  background: var(--bar);
  backdrop-filter: blur(12px);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}

.checkout__inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 46rem;
  margin: 0 auto;
}

.basket {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
}

.basket__toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}

.basket__lines {
  display: grid;
  gap: 6px;
  max-height: 26vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 12px 12px;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.basket__line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.basket__line--fee {
  font-style: italic;
}

.checkout__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.summary {
  min-width: 0;
}

.summary__count {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.summary__total {
  font-size: 1.25rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 20px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.12s ease;
}

.cta:hover:not([disabled]) {
  background: var(--accent-hover);
}

.cta:active:not([disabled]) {
  transform: scale(0.97);
}

.cta[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

.hint {
  margin: 0;
  font-size: 0.78rem;
  color: var(--text-muted);
  min-height: 1rem;
}

.datetime-field {
  margin-bottom: 12px;
}

.datetime-label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
}

.datetime-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.18s ease;
}

.datetime-input::placeholder {
  color: var(--text-muted);
}

.datetime-input:focus {
  border-color: var(--accent);
}

/* ---------- Branch Selection Modal ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 400px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  transform: scale(0.9);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal {
  transform: scale(1);
}

.modal__header {
  padding: 20px 50px 20px 20px;
  border-bottom: 1px solid var(--border);
}

.modal__title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
}

.modal__body {
  padding: 20px;
}

.modal__close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}

.modal__close:hover {
  color: var(--text);
}

.branch-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.branch-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease;
}

.branch-item:hover {
  border-color: var(--accent);
  background: var(--surface-hover);
}

.branch-item__name {
  font-weight: 600;
  color: var(--text);
}

.branch-item__phone {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.pop {
  animation: pop 0.25s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- Hero extras: socials ---------- */
.hero__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.socials {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.social {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.18s ease, border-color 0.18s ease;
}

.social:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.social svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.socials--labelled .social {
  padding: 8px 14px;
  border-radius: 9999px;
  font-size: 0.82rem;
}

/* ---------- Desktop split layout ---------- */
@media (min-width: 768px) {
  .app {
    flex-direction: row;
  }

  .hero {
    flex: 0 0 40%;
    padding: 40px;
    gap: 16px;
  }

  .hero__logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    font-size: 1.6rem;
  }

  .panel {
    flex: 1;
    border-top: 0;
    border-left: 1px solid var(--border);
  }

  .tabs-wrapper {
    margin-top: 20px;
  }

  .catalogue {
    padding: 20px 24px 24px;
  }

  .checkout {
    padding: 16px 24px;
  }
}

    </style>
</head>
<body>
    <main class="app">
        <!-- Branding -->
        <header class="hero">
            <div class="hero__glow" aria-hidden="true"></div>
            <div class="hero__inner">
                <div class="hero__logo" id="logo"></div>
                <h1 class="hero__name" id="business-name"></h1>
                <p class="hero__tagline" id="tagline"></p>
                <a class="badge" id="status-badge" href="#" target="_blank" rel="noopener noreferrer">
                    <svg class="badge__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    <span id="status-text"></span>
                </a>
                <div class="hero__meta">
                    <div class="socials" id="socials" aria-label="Social links" hidden></div>
                </div>
            </div>
        </header>

        <!-- Catalogue -->
        <section class="panel" aria-label="Menu">
            <div class="tabs-wrapper" id="tabs-wrapper">
                <div class="tabs-container" id="tabs-container" hidden>
                    <button class="tabs-nav tabs-nav--left" id="tabs-nav-left" aria-label="Scroll categories left">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                        </svg>
                    </button>
                    <div class="tabs" id="tabs" role="tablist" aria-label="Categories"></div>
                    <button class="tabs-nav tabs-nav--right" id="tabs-nav-right" aria-label="Scroll categories right">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="catalogue" id="catalogue"></div>

            <!-- Checkout -->
            <div class="checkout">
                <div class="checkout__inner">
                    <div class="basket" id="basket" hidden>
                        <button type="button" class="basket__toggle" id="basket-toggle"

function money(amount) {
  const { symbol, locale, decimals } = CONFIG.currency;
  return `${symbol}${amount.toLocaleString(locale, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  })}`;
}

function initials(name) {
  return name
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((word) => word[0].toUpperCase())
    .join("");
}

function resolveTheme() {
  return CONFIG.theme;
}

function socialIcon(label) {
  const key = label.toLowerCase().replace(/[^a-z]/g, "");
  const path = SOCIAL_PATHS[key];
  if (!path) return null;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
  shape.setAttribute("d", path);
  svg.append(shape);
  return svg;
}

function renderSocials(container, options = {}) {
  if (!container) return;
  const socials = CONFIG.socials || [];
  container.hidden = socials.length === 0;
  container.replaceChildren(
    ...socials.flatMap((social) => {
      const icon = socialIcon(social.label);
      if (!icon) return []; // skip unrecognised platforms
      const link = document.createElement("a");
      link.className = "social";
      link.href = social.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `${CONFIG.business.name} on ${social.label}`);
      link.append(icon);
      if (options.showLabels) {
        const text = document.createElement("span");
        text.className = "social__label";
        text.textContent = social.label;
        link.append(text);
      }
      return [link];
    })
  );
}

/* ---------- branding ---------- */

function applyBranding() {
  const { business } = CONFIG;
  document.documentElement.dataset.theme = resolveTheme();
  document.title = business.pageTitle || business.name;

  const set = (id, text) => {
    const node = document.getElementById(id);
    if (node) node.textContent = text || "";
  };
  set("business-name", business.name);
  set("tagline", business.tagline);
  set("status-text", business.status);

  const badge = document.getElementById("status-badge");
  if (badge) {
    badge.hidden = !business.status;
    if (business.mapLink) {
      badge.href = business.mapLink;
    }
  }

  const logo = document.getElementById("logo");
  if (logo) {
    if (business.logo) {
      const img = document.createElement("img");
      img.src = business.logo;
      img.alt = `${business.name} logo`;
      logo.replaceChildren(img);
    } else {
      logo.textContent = initials(business.name);
    }
  }

  document.querySelectorAll("[data-meta-description]").forEach((tag) => {
    tag.setAttribute("content", business.description || business.tagline);
  });
  document.querySelectorAll("[data-meta-title]").forEach((tag) => {
    tag.setAttribute("content", business.pageTitle || business.name);
  });
  if (business.shareImage) {
    document.querySelectorAll("[data-meta-image]").forEach((tag) => {
      tag.setAttribute("content", business.shareImage);
    });
  }

  document.querySelectorAll("[data-keep-params]").forEach((link) => {
    if (typeof withParams === "function") {
      link.href = withParams(link.getAttribute("href"));
    }
  });
}

function whatsappLink(message) {
  const phone = String(CONFIG.whatsapp.phone).replace(/\D/g, "");
  if (!phone) return "";
  return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
}

    /* ---- app.js ---- */
/*
 * Rendering + basket state. No business data lives in this file.
 */
/* Scoped per business so previewing another preset never inherits its basket. */
const STORAGE_KEY = `vae-basket-v1:${CONFIG.business.name}`;
const basket = new Map(); // itemId -> quantity

const el = {
  socials: document.getElementById("socials"),
  tabsWrapper: document.getElementById("tabs-wrapper"),
  tabsContainer: document.getElementById("tabs-container"),
  tabs: document.getElementById("tabs"),
  tabsNavLeft: document.getElementById("tabs-nav-left"),
  tabsNavRight: document.getElementById("tabs-nav-right"),
  catalogue: document.getElementById("catalogue"),
  basket: document.getElementById("basket"),
  basketToggle: document.getElementById("basket-toggle"),
  basketLabel: document.getElementById("basket-label"),
  basketLines: document.getElementById("basket-lines"),
  count: document.getElementById("count"),
  total: document.getElementById("total"),
  cta: document.getElementById("cta"),
  hint: document.getElementById("hint"),
  branchModal: document.getElementById("branch-modal"),
  branchList: document.getElementById("branch-list"),
  modalClose: document.getElementById("modal-close"),
};

// Store observer for cleanup
let scrollspyObserver = null;
// Flag to suppress scrollspy highlights during programmatic scrolling
let isProgrammaticScroll = false;

const labels = CONFIG.labels || {};

const itemIndex = new Map();
CONFIG.categories.forEach((category) =>
  category.items.forEach((item) => itemIndex.set(item.id, { ...item, category: category.label }))
);

/* ---------- helpers ---------- */

function feeTotal() {
  return (CONFIG.fees || []).reduce((sum, fee) => sum + fee.amount, 0);
}

function itemsTotal() {
  let sum = 0;
  basket.forEach((qty, id) => {
    const item = itemIndex.get(id);
    if (item) sum += item.price * qty;
  });
  return sum;
}

function itemCount() {
  let sum = 0;
  basket.forEach((qty) => {
    sum += qty;
  });
  return sum;
}

/* ---------- rendering ---------- */

function shouldUseAdvancedNavigation() {
  return CONFIG.categories.length >= 4;
}

function renderTabs() {
  const advanced = shouldUseAdvancedNavigation();

  if (advanced) {
    // Advanced mode: show the full tabs-container (with arrow buttons)
    if (el.tabsContainer) el.tabsContainer.hidden = false;

    // Render pills into the existing #tabs div inside tabs-container
    if (!el.tabs) return;
    el.tabs.className = "tabs";

    // Remove any previous keydown listener before re-adding to prevent accumulation
    if (el.tabs._keydownHandler) {
      el.tabs.removeEventListener("keydown", el.tabs._keydownHandler);
    }
    el.tabs._keydownHandler = onTabKeydown;

    el.tabs.replaceChildren(
      ...CONFIG.categories.map((category, index) => {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "tab";
        tab.id = `tab-${category.id}`;
        tab.setAttribute("role", "tab");
        tab.textContent = category.label;
        tab.setAttribute("aria-selected", String(index === 0));
        tab.setAttribute("aria-controls", `panel-${category.id}`);
        tab.tabIndex = index === 0 ? 0 : -1;
        tab.addEventListener("click", () => selectCategory(category.id));
        return tab;
      })
    );
    el.tabs.addEventListener("keydown", el.tabs._keydownHandler);
    setupTabsNavigation();
  } else {
    // Simple mode: hide tabs-container entirely, inject a standalone pill row
    if (el.tabsContainer) el.tabsContainer.hidden = true;

    // Remove any previously injected simple-mode row
    const existing = el.tabsWrapper && el.tabsWrapper.querySelector(".tabs.simple-mode");
    if (existing) existing.remove();

    if (!el.tabsWrapper) return;

    const simpleRow = document.createElement("div");
    simpleRow.className = "tabs simple-mode";
    simpleRow.setAttribute("role", "tablist");
    simpleRow.setAttribute("aria-label", "Categories");

    CONFIG.categories.forEach((category, index) => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab";
      tab.id = `tab-${category.id}`;
      tab.setAttribute("role", "tab");
      tab.textContent = category.label;
      tab.setAttribute("aria-selected", String(index === 0));
      tab.setAttribute("aria-controls", `panel-${category.id}`);
      tab.tabIndex = index === 0 ? 0 : -1;
      tab.addEventListener("click", () => selectCategory(category.id));
      simpleRow.appendChild(tab);
    });

    simpleRow.addEventListener("keydown", onTabKeydown);
    el.tabsWrapper.appendChild(simpleRow);

    // Point el.tabs at the new row so the rest of the code can use it
    el.tabs = simpleRow;
  }
}

function card(item) {
  const selected = basket.has(item.id);
  const soldOut = item.available === false;

  const wrapper = document.createElement("div");
  wrapper.className = "card";
  wrapper.dataset.itemId = item.id;
  wrapper.dataset.selected = String(selected);
  if (soldOut) {
    wrapper.dataset.soldOut = "true";
  }

  const button = document.createElement("button");
  button.type = "button";
  button.className = "card__main";
  button.setAttribute("aria-pressed", String(selected));
  button.disabled = soldOut;

  const body = document.createElement("div");
  body.className = "card__body";
  const name = document.createElement("h3");
  name.className = "card__name";
  name.textContent = soldOut ? `${item.name} — sold out` : item.name;
  body.append(name);
  if (item.desc) {
    const desc = document.createElement("p");
    desc.className = "card__desc";
    desc.textContent = item.desc;
    body.append(desc);
  }

  const price = document.createElement("span");
  price.className = item.price ? "card__price" : "card__price card__price--quote";
  price.textContent = item.price ? money(item.price) : item.note || "On quote";

  button.append(body, price);
  button.addEventListener("click", () => toggleItem(item.id));

  const aside = document.createElement("div");
  aside.className = "card__aside";
  const checkOrStepper = selected ? stepper(item) : check();
  if (!selected) {
    checkOrStepper.addEventListener("click", () => toggleItem(item.id));
  }
  aside.append(checkOrStepper);

  wrapper.append(button, aside);
  return wrapper;
}

function check() {
  const mark = document.createElement("button");
  mark.type = "button";
  mark.className = "card__check";
  mark.setAttribute("aria-hidden", "true");
  mark.setAttribute("tabindex", "-1");
  mark.textContent = "+";
  mark.style.cursor = "pointer";
  mark.style.border = "none";
  mark.style.background = "transparent";
  mark.style.padding = "0";
  return mark;
}

function stepper(item) {
  const wrap = document.createElement("div");
  wrap.className = "stepper";

  const minus = document.createElement("button");
  minus.type = "button";
  minus.className = "stepper__btn";
  minus.textContent = "−";
  minus.setAttribute("aria-label", `Remove one ${item.name}`);
  minus.dataset.control = "minus";
  minus.addEventListener("click", () => changeQty(item.id, -1));

  const qty = document.createElement("span");
  qty.className = "stepper__qty";
  qty.textContent = String(basket.get(item.id));

  const plus = document.createElement("button");
  plus.type = "button";
  plus.className = "stepper__btn";
  plus.textContent = "+";
  plus.setAttribute("aria-label", `Add one ${item.name}`);
  plus.dataset.control = "plus";
  plus.addEventListener("click", () => changeQty(item.id, 1));

  wrap.append(minus, qty, plus);
  return wrap;
}

function renderCatalogue(activeId) {
  el.catalogue.replaceChildren(
    ...CONFIG.categories.map((category) => {
      const panel = document.createElement("div");
      panel.className = "card-list";
      panel.id = `panel-${category.id}`;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", `tab-${category.id}`);

      // Show all categories in advanced navigation mode, or single category in simple mode
      if (shouldUseAdvancedNavigation()) {
        panel.hidden = false;
        // Add category header with a stable id for the IntersectionObserver
        const header = document.createElement("h2");
        header.className = "category-header";
        header.id = `header-${category.id}`;
        header.textContent = category.label;
        panel.prepend(header);
      } else {
        panel.hidden = category.id !== activeId;
      }

      if (!category.items.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Nothing here yet — check the other categories.";
        panel.append(empty);
      } else {
        panel.append(...category.items.map(card));
      }
      return panel;
    })
  );
}

function renderBasket() {
  const count = itemCount();
  const items = itemsTotal();
  const fees = count ? feeTotal() : 0;

  el.count.textContent = count === 1 ? "1 item selected" : `${count} items selected`;
  el.total.textContent = money(items + fees);
  el.total.classList.remove("pop");
  if (count) {
    void el.total.offsetWidth;
    el.total.classList.add("pop");
  }

  el.basket.hidden = count === 0;
  el.basketLabel.textContent = count === 1 ? "1 item in basket" : `${count} items in basket`;

  const lines = [];
  basket.forEach((qty, id) => {
    const item = itemIndex.get(id);
    if (!item) return;
    lines.push({
      label: `${qty}× ${item.name}`,
      value: item.price ? money(item.price * qty) : item.note || "On quote",
    });
  });
  (CONFIG.fees || []).forEach((fee) => {
    if (count) lines.push({ label: fee.label, value: money(fee.amount), fee: true });
  });

  el.basketLines.replaceChildren(
    ...lines.map((line) => {
      const row = document.createElement("div");
      row.className = line.fee ? "basket__line basket__line--fee" : "basket__line";
      const label = document.createElement("span");
      label.textContent = line.label;
      const value = document.createElement("span");
      value.textContent = line.value;
      row.append(label, value);
      return row;
    })
  );

  const belowMinimum = CONFIG.minimumOrder && items > 0 && items < CONFIG.minimumOrder;
  const dateTimeMissing = CONFIG.niche === "services" && count > 0 && !getDateTimeValue();
  el.cta.disabled = count === 0 || belowMinimum || dateTimeMissing;
  if (!count) {
    el.hint.textContent = labels.emptyHint || "Tap an item to start your order.";
  } else if (belowMinimum) {
    const scope = feeTotal() ? " before fees" : "";
    el.hint.textContent = `Minimum order is ${money(CONFIG.minimumOrder)}${scope} — add ${money(
      CONFIG.minimumOrder - items
    )} more.`;
  } else if (dateTimeMissing) {
    el.hint.textContent = "Please enter your preferred date & time.";
  } else {
    el.hint.textContent = "";
  }
}

/* ---------- state ---------- */

function selectCategory(categoryId) {
  Array.from(el.tabs.children).forEach((tab) => {
    const active = tab.id === `tab-${categoryId}`;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });

  if (shouldUseAdvancedNavigation()) {
    // Suppress scrollspy while we programmatically scroll to the section
    isProgrammaticScroll = true;
    clearTimeout(selectCategory._timer);
    const panel = el.catalogue.querySelector(`#panel-${categoryId}`);
    if (panel) {
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    // Re-enable scrollspy after the smooth-scroll animation finishes (~600ms)
    selectCategory._timer = setTimeout(() => { isProgrammaticScroll = false; }, 600);
  } else {
    Array.from(el.catalogue.children).forEach((panel) => {
      panel.hidden = panel.id !== `panel-${categoryId}`;
    });
    el.catalogue.scrollTop = 0;
  }
}

function onTabKeydown(event) {
  const tabs = Array.from(el.tabs.children);
  const current = tabs.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
  const offset = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
  if (!offset) return;
  event.preventDefault();
  const next = tabs[(current + offset + tabs.length) % tabs.length];
  if (shouldUseAdvancedNavigation()) {
    const categoryId = next.id.replace("tab-", "");
    highlightTab(categoryId);
    centerTab(categoryId);
    // Suppress scrollspy during keyboard-initiated scroll (same as click path)
    isProgrammaticScroll = true;
    clearTimeout(onTabKeydown._timer);
    const panel = el.catalogue.querySelector(`#panel-${categoryId}`);
    if (panel) {
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    onTabKeydown._timer = setTimeout(() => { isProgrammaticScroll = false; }, 600);
  } else {
    selectCategory(next.id.replace("tab-", ""));
  }
  next.focus();
}

function activeCategoryId() {
  const active = Array.from(el.tabs.children).find(
    (tab) => tab.getAttribute("aria-selected") === "true"
  );
  return active ? active.id.replace("tab-", "") : CONFIG.categories[0].id;
}

/* Re-rendering a category drops focus, so put it back where the user left it. */
function focusTarget() {
  const focused = document.activeElement;
  const card = focused && focused.closest ? focused.closest(".card") : null;
  if (!card) return null;
  return { itemId: card.dataset.itemId, control: focused.dataset.control || "main" };
}

function restoreFocus(target) {
  if (!target) return;
  const card = el.catalogue.querySelector(`[data-item-id="${target.itemId}"]`);
  if (!card) return;
  const next =
    card.querySelector(`[data-control="${target.control}"]`) || card.querySelector(".card__main");
  if (next) next.focus();
}

/* ---------- Advanced Navigation Functions ---------- */

function setupTabsNavigation() {
  if (!el.tabsNavLeft || !el.tabsNavRight || !el.tabs) return;

  // Use named handlers stored on the elements so we can remove them before
  // re-adding, preventing listener accumulation on repeated renderTabs() calls.
  if (el.tabsNavLeft._clickHandler) {
    el.tabsNavLeft.removeEventListener("click", el.tabsNavLeft._clickHandler);
  }
  if (el.tabsNavRight._clickHandler) {
    el.tabsNavRight.removeEventListener("click", el.tabsNavRight._clickHandler);
  }
  if (el.tabs._scrollHandler) {
    el.tabs.removeEventListener("scroll", el.tabs._scrollHandler);
  }

  el.tabsNavLeft._clickHandler = () => el.tabs.scrollBy({ left: -200, behavior: "smooth" });
  el.tabsNavRight._clickHandler = () => el.tabs.scrollBy({ left: 200, behavior: "smooth" });
  el.tabs._scrollHandler = updateNavArrows;

  el.tabsNavLeft.addEventListener("click", el.tabsNavLeft._clickHandler);
  el.tabsNavRight.addEventListener("click", el.tabsNavRight._clickHandler);
  el.tabs.addEventListener("scroll", el.tabs._scrollHandler);

  updateNavArrows();
}

function updateNavArrows() {
  if (!el.tabs || !el.tabsNavLeft || !el.tabsNavRight) return;
  const maxScroll = Math.max(0, el.tabs.scrollWidth - el.tabs.clientWidth);
  el.tabsNavLeft.disabled = el.tabs.scrollLeft <= 0;
  el.tabsNavRight.disabled = maxScroll === 0 || el.tabs.scrollLeft >= maxScroll;
}

function setupScrollspy(activeId) {
  if (!el.catalogue) return;

  // Tear down any previous observer
  if (scrollspyObserver) {
    scrollspyObserver.disconnect();
    scrollspyObserver = null;
  }

  // Remove any legacy scroll listener
  if (el.catalogue._scrollHandler) {
    el.catalogue.removeEventListener("scroll", el.catalogue._scrollHandler);
    delete el.catalogue._scrollHandler;
  }

  scrollspyObserver = new IntersectionObserver(
    (entries) => {
      // Skip observer-driven highlights while a click/keyboard scroll is in flight
      if (isProgrammaticScroll) return;

      // Collect all headers that are currently intersecting
      entries.forEach((entry) => {
        entry.target._isIntersecting = entry.isIntersecting;
      });

      // Walk the categories in DOM order and pick the first visible header
      for (const category of CONFIG.categories) {
        const header = el.catalogue.querySelector(`#header-${category.id}`);
        if (header && header._isIntersecting) {
          highlightTab(category.id);
          centerTab(category.id);
          return;
        }
      }

      // If nothing is intersecting (e.g. scrolled past all headers) pick the
      // last category whose header is above the viewport mid-point.
      let best = CONFIG.categories[0].id;
      for (const category of CONFIG.categories) {
        const header = el.catalogue.querySelector(`#header-${category.id}`);
        if (!header) continue;
        const rect = header.getBoundingClientRect();
        const catalogueRect = el.catalogue.getBoundingClientRect();
        if (rect.top < catalogueRect.top + catalogueRect.height * 0.5) {
          best = category.id;
        }
      }
      highlightTab(best);
      centerTab(best);
    },
    {
      root: el.catalogue,
      rootMargin: "-15% 0px -60% 0px",
      threshold: 0,
    }
  );

  // Observe every category header
  CONFIG.categories.forEach((category) => {
    const header = el.catalogue.querySelector(`#header-${category.id}`);
    if (header) {
      header._isIntersecting = false;
      scrollspyObserver.observe(header);
    }
  });

  // Highlight the currently-active tab (not always the first one)
  const initialId = activeId || CONFIG.categories[0].id;
  highlightTab(initialId);
  centerTab(initialId);
}

function highlightTab(categoryId) {
  if (!el.tabs || !el.tabs.children) return;

  Array.from(el.tabs.children).forEach((tab) => {
    const active = tab.id === `tab-${categoryId}`;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });
}

function centerTab(categoryId) {
  if (!el.tabs) return;
  const tab = el.tabs.querySelector(`#tab-${categoryId}`);
  if (!tab) return;

  // scrollIntoView with nearest block prevents the page from scrolling;
  // inline: center keeps the active pill horizontally centred in the strip.
  tab.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
}

function refreshCards() {
  const target = focusTarget();
  // Preserve scroll position so a basket interaction doesn't jump the user back to the top
  const savedScrollTop = el.catalogue ? el.catalogue.scrollTop : 0;
  const activeId = activeCategoryId();
  renderCatalogue(activeId);
  if (el.catalogue) el.catalogue.scrollTop = savedScrollTop;
  // Re-attach scrollspy on the fresh DOM nodes, restoring the active tab
  if (shouldUseAdvancedNavigation()) {
    setupScrollspy(activeId);
  }
  renderBasket();
  restoreFocus(target);
  save();
}

function toggleItem(itemId) {
  if (basket.has(itemId)) {
    basket.delete(itemId);
  } else {
    basket.set(itemId, 1);
  }
  refreshCards();
}

function changeQty(itemId, delta) {
  const next = (basket.get(itemId) || 0) + delta;
  if (next <= 0) {
    basket.delete(itemId);
  } else {
    basket.set(itemId, Math.min(next, 99));
  }
  refreshCards();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(basket.entries())));
  } catch (error) {
    /* private mode — basket simply will not persist */
  }
}

function restore() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    stored.forEach(([id, qty]) => {
      const item = itemIndex.get(id);
      if (item && item.available !== false && Number.isFinite(qty) && qty > 0) {
        basket.set(id, Math.min(qty, 99));
      }
    });
  } catch (error) {
    /* corrupt storage — start with an empty basket */
  }
}

/* ---------- checkout ---------- */

function orderReference() {
  return Math.random().toString(36).slice(2, 6).toUpperCase();
}

/* ---------- Branch Selection Modal ---------- */

function showBranchModal() {
  // Clear existing branches
  el.branchList.innerHTML = "";

  // Add branch items
  CONFIG.branches.forEach((branch) => {
    const branchItem = document.createElement("div");
    branchItem.className = "branch-item";

    const nameSpan = document.createElement("span");
    nameSpan.className = "branch-item__name";
    nameSpan.textContent = branch.name;

    const phoneSpan = document.createElement("span");
    phoneSpan.className = "branch-item__phone";
    phoneSpan.textContent = "+" + String(branch.phone).replace(/^\+/, "");

    branchItem.append(nameSpan, phoneSpan);
    branchItem.addEventListener("click", () => selectBranch(branch));
    el.branchList.appendChild(branchItem);
  });

  // Show modal
  el.branchModal.classList.add("active");
  el.branchModal.setAttribute("aria-hidden", "false");
}

function hideBranchModal() {
  el.branchModal.classList.remove("active");
  el.branchModal.setAttribute("aria-hidden", "true");
}

function selectBranch(branch) {
  hideBranchModal();
  const message = buildMessage();
  const phone = String(branch.phone).replace(/\D/g, "");
  if (!phone) {
    el.hint.textContent = "No WhatsApp number configured for this branch.";
    return;
  }
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank", "noopener");
}

/* ---------- Dynamic Date/Time Field for Services Niche ---------- */

function updateButtonState() {
  const count = itemCount();
  const items = itemsTotal();
  const belowMinimum = CONFIG.minimumOrder && items > 0 && items < CONFIG.minimumOrder;
  const dateTimeMissing = CONFIG.niche === "services" && count > 0 && !getDateTimeValue();
  el.cta.disabled = count === 0 || belowMinimum || dateTimeMissing;
  if (dateTimeMissing && count > 0) {
    el.hint.textContent = "Please enter your preferred date & time.";
  } else if (!dateTimeMissing && count > 0 && !belowMinimum) {
    el.hint.textContent = "";
  }
}

function createDateTimeInput() {
  const wrapper = document.createElement("div");
  wrapper.className = "datetime-field";
  wrapper.id = "datetime-field";

  const label = document.createElement("label");
  label.className = "datetime-label";
  label.textContent = "Preferred Date & Time *";
  label.setAttribute("for", "datetime-input");

  const input = document.createElement("input");
  input.type = "text";
  input.id = "datetime-input";
  input.className = "datetime-input";
  input.placeholder = "e.g. 26 Aug, 3:00 PM";
  input.setAttribute("aria-label", "Preferred date and time");
  input.required = true;

  // Update button state on input
  input.addEventListener("input", () => {
    updateButtonState();
  });

  wrapper.appendChild(label);
  wrapper.appendChild(input);
  return wrapper;
}

function updateDateTimeField() {
  const existingField = document.getElementById("datetime-field");
  const checkoutInner = document.querySelector(".checkout__inner");

  if (CONFIG.niche === "services") {
    if (!existingField) {
      const field = createDateTimeInput();
      // Insert at the top of checkout__inner, before the basket
      checkoutInner.insertBefore(field, checkoutInner.firstChild);
    }
  } else {
    if (existingField) {
      existingField.remove();
    }
  }
}

function getDateTimeValue() {
  if (CONFIG.niche !== "services") return "";
  const input = document.getElementById("datetime-input");
  return input ? input.value.trim() : "";
}

function buildMessage() {
  const greeting = CONFIG.whatsapp.greeting.replace("{business_name}", CONFIG.business.name);
  const lines = [greeting, ""];
  basket.forEach((qty, id) => {
    const item = itemIndex.get(id);
    if (!item) return;
    const value = item.price ? money(item.price * qty) : item.note || "On quote";
    lines.push(`• ${qty}× ${item.name} — ${value}`);
  });
  (CONFIG.fees || []).forEach((fee) => lines.push(`• ${fee.label} — ${money(fee.amount)}`));
  lines.push("", `Total: ${money(itemsTotal() + feeTotal())}`, `Ref: #${orderReference()}`);
  if (CONFIG.whatsapp.closing) {
    const closing = CONFIG.whatsapp.closing.replace("{business_name}", CONFIG.business.name);
    lines.push("", closing);
  }
  const dateTime = getDateTimeValue();
  if (dateTime) {
    lines.push("", `Preferred Date/Time: ${dateTime}`);
  }
  return lines.join("\n");
}

function checkout() {
  if (!basket.size) return;

  // Validate date/time for services niche
  if (CONFIG.niche === "services") {
    const dateTimeInput = document.getElementById("datetime-input");
    if (!dateTimeInput || !dateTimeInput.value.trim()) {
      el.hint.textContent = "Please enter your preferred date & time.";
      if (dateTimeInput) {
        dateTimeInput.focus();
      }
      return;
    }
  }

  // Check if branches are enabled and configured
  if (CONFIG.useBranches && CONFIG.branches && CONFIG.branches.length > 0) {
    showBranchModal();
    return;
  }

  // Use default WhatsApp number if no branches
  const url = whatsappLink(buildMessage());
  if (!url) {
    el.hint.textContent = "No WhatsApp number configured yet.";
    return;
  }
  window.open(url, "_blank", "noopener");
}

/* ---------- boot ---------- */

applyBranding();
el.cta.firstChild.textContent = labels.cta || "Order on WhatsApp";
renderSocials(el.socials);
renderTabs();
restore();
renderCatalogue(CONFIG.categories[0].id);
renderBasket();
updateDateTimeField();

// Setup scrollspy after catalogue is rendered
if (shouldUseAdvancedNavigation()) {
  setupScrollspy();
}

el.cta.addEventListener("click", checkout);
el.basketToggle.addEventListener("click", () => {
  const expanded = el.basketToggle.getAttribute("aria-expanded") === "true";
  el.basketToggle.setAttribute("aria-expanded", String(!expanded));
  el.basketLines.hidden = expanded;
});

// Branch modal close button
el.modalClose.addEventListener("click", hideBranchModal);

// Close modal when clicking outside
el.branchModal.addEventListener("click", (e) => {
  if (e.target === el.branchModal) {
    hideBranchModal();
  }
});
