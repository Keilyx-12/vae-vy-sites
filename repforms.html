<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rep Order Form | VY Sites</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #fff; font-family: system-ui, sans-serif; }
    #loading { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; font-size: 1.2rem; }
    
    /* Top Bar Styling */
    #copy-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    
    .fillout-btn {
      background-color: #a246b3;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .fillout-btn:hover { background-color: #8e3aa0; }
    .fillout-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div id="loading">Generating secure order ID...</div>

  <!-- Real Copy Button Bar -->
  <div id="copy-bar">
    <span id="order-label" style="font-weight: 600; color: #cbd5e1;">Order ID: Loading...</span>
    <button class="fillout-btn" id="copyBtn" onclick="copyClientLink()">Copy Client Link</button>
  </div>

  <div id="form-container" style="width:100%;height:calc(100vh - 55px);"></div>

  <script>
    let currentOrderId = '';

    async function loadFormWithGlobalID() {
      const urlParams = new URLSearchParams(window.location.search);

      if (!urlParams.has('order_id')) {
        try {
          const response = await fetch('https://order-counter.thefakeemail976.workers.dev');
          const data = await response.json();
          
          if (data && data.order_id) {
            urlParams.set('order_id', data.order_id);
            const newUrl = window.location.pathname + '?' + urlParams.toString();
            window.history.replaceState(null, '', newUrl);
          }
        } catch (err) {
          console.error("Worker fetch failed:", err);
          document.getElementById('loading').innerText = "Error loading order form.";
          return;
        }
      }

      currentOrderId = urlParams.get('order_id') || '';

      document.getElementById('loading').style.display = 'none';
      document.getElementById('copy-bar').style.display = 'flex';
      document.getElementById('order-label').innerText = `Active Order ID: ${currentOrderId}`;

      document.getElementById('form-container').innerHTML = `
        <div data-fillout-id="3wuF4gSz7Dus" 
             data-fillout-embed-type="fullscreen" 
             style="width:100%;height:100%;" 
             data-fillout-inherit-parameters>
        </div>
      `;

      const script = document.createElement('script');
      script.src = "https://server.fillout.com/embed/v1/";
      document.body.appendChild(script);
    }

    function copyClientLink() {
      const fullUrl = `https://vysites.com/minibuilder.html?order_id=${currentOrderId}`;
      navigator.clipboard.writeText(fullUrl).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = "Copied!";
        btn.style.backgroundColor = "#22c55e";
        setTimeout(() => {
          btn.innerText = "Copy Client Link";
          btn.style.backgroundColor = "#a246b3";
        }, 2500);
      });
    }

    loadFormWithGlobalID();
  </script>
</body>
</html>
