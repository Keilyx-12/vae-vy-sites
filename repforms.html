<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rep Order Form | VY Sites</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="form-container" style="width:100%;height:100%;"></div>

  <script>
    function getShortTrackingID() {
      let count = parseInt(localStorage.getItem('vysites_order_count') || '0', 10);
      const alphabet = "abcdefghijklmnopqrstuvwxyz";
      const numberPrefix = Math.floor(count / 26) + 1;
      const letterSuffix = alphabet[count % 26];
      const trackingID = `${numberPrefix}${letterSuffix}`;

      localStorage.setItem('vysites_order_count', count + 1);
      return trackingID;
    }

    const autoGeneratedID = getShortTrackingID();

    const container = document.getElementById('form-container');
    container.innerHTML = `
      <div data-fillout-id="3wuF4gSz7Dus" 
           data-fillout-embed-type="fullscreen" 
           style="width:100%;height:100%;" 
           data-fillout-inherit-parameters
           data-fillout-order_id="${autoGeneratedID}">
      </div>
    `;
  </script>
  <script src="https://server.fillout.com/embed/v1/"></script>
</body>
</html>
