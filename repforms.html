<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rep Order Form | VY Sites</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background: #0f172a; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    #loading { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      text-align: center; 
      font-size: 1.2rem; 
    }
    #form-container { 
      width: 100%; 
      height: 100vh; 
    }
  </style>
</head>
<body>
  <div id="loading">Generating secure order ID...</div>

  <div id="form-container"></div>

  <script>
    async function loadFormWithGlobalID() {
      const urlParams = new URLSearchParams(window.location.search);

      // 1. Fetch sequential ID from Cloudflare Worker if order_id isn't in URL
      if (!urlParams.has('order_id')) {
        try {
          const response = await fetch('https://order-counter.thefakeemail976.workers.dev');
          const data = await response.json();
          
          if (data && data.order_id) {
            urlParams.set('order_id', data.order_id);
            const newUrl = window.location.pathname + '?' + urlParams.toString();
            window.history.replaceState(null, '', newUrl);
          }
        } catch (err) {
          console.error("Worker fetch failed:", err);
          document.getElementById('loading').innerText = "Error loading order form. Please refresh.";
          return;
        }
      }

      // 2. Hide loading screen
      document.getElementById('loading').style.display = 'none';

      // 3. Render Fillout form (passes order_id automatically via data-fillout-inherit-parameters)
      document.getElementById('form-container').innerHTML = `
        <div data-fillout-id="3wuF4gSz7Dus" 
             data-fillout-embed-type="fullscreen" 
             style="width:100%;height:100%;" 
             data-fillout-inherit-parameters>
        </div>
      `;

      // 4. Inject Fillout Embed Script
      const script = document.createElement('script');
      script.src = "https://server.fillout.com/embed/v1/";
      document.body.appendChild(script);
    }

    loadFormWithGlobalID();
  </script>
</body>
</html>
