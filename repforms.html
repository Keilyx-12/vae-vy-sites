<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rep Order Form | VY Sites</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="form-container" style="width:100%;height:100%;"></div>

  <script>
    async function loadFormWithGlobalID() {
      const urlParams = new URLSearchParams(window.location.search);

      // Check if order_id is missing from URL
      if (!urlParams.has('order_id')) {
        try {
          const response = await fetch('https://order-counter.thefakeemail976.workers.dev');
          const data = await response.json();
          
          if (data && data.order_id) {
            // Update browser URL bar instantly WITHOUT reloading page
            urlParams.set('order_id', data.order_id);
            const newUrl = window.location.pathname + '?' + urlParams.toString();
            window.history.replaceState(null, '', newUrl);
          }
        } catch (err) {
          console.error("Failed to fetch global order ID:", err);
        }
      }

      // Render Fillout container (Fillout will read updated URL naturally)
      document.getElementById('form-container').innerHTML = `
        <div data-fillout-id="3wuF4gSz7Dus" 
             data-fillout-embed-type="fullscreen" 
             style="width:100%;height:100%;" 
             data-fillout-inherit-parameters>
        </div>
      `;

      // Load Fillout SDK script
      const script = document.createElement('script');
      script.src = "https://server.fillout.com/embed/v1/";
      document.body.appendChild(script);
    }

    loadFormWithGlobalID();
  </script>
</body>
</html>
