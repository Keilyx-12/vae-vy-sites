<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VY Sites — Premium Website Themes</title>
  <meta name="description" content="Explore Cyber, Luxe, and Artisan website themes by VY Sites.">
  <link rel="icon" href="./logo.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #13161f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f1f5f9;
      padding: 32px 20px;
    }

    .page-border {
      padding: 2px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e8395e 0%, #9b6dea 50%, #00c6d7 100%);
      width: 100%;
      max-width: 520px;
    }

    .container {
      background: #13161f;
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon span {
      font-weight: 700;
      font-size: 14px;
      color: #f1f5f9;
    }

    .logo-name {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }

    h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #5b8dee, #9b6dea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    /* Tabs with gradient border */
    .tabs-border {
      padding: 2px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e8395e 0%, #9b6dea 50%, #00c6d7 100%);
      margin-bottom: 20px;
    }

    .tabs {
      display: inline-flex;
      background: #1a1f2e;
      border-radius: 10px;
      padding: 4px;
      gap: 2px;
    }

    .tab {
      background: none;
      border: none;
      cursor: pointer;
      padding: 7px 20px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      transition: all 0.2s;
    }

    .tab.active {
      background: #13161f;
      color: #f1f5f9;
    }

    .tab:hover:not(.active) {
      color: #cbd5e1;
    }

    /* Clickable Preview Wrapper */
    .preview-wrapper {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .preview-link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .preview-link:hover {
      opacity: 0.95;
    }

    #preview-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .preview-label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(19, 22, 31, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .hint {
      margin-top: 14px;
      color: #475569;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="page-border">
    <div class="container">

      <div class="logo-row">
        <div class="logo-icon"><span>VY</span></div>
        <span class="logo-name">VY Sites</span>
      </div>

      <h1>Build websites that stand out.</h1>
      <p class="subtitle">Preview three premium themes. Click the image to visit the live site.</p>

      <div class="tabs-border">
        <div class="tabs">
          <button class="tab active" id="tab-cyber"   onclick="switchTheme('cyber')">Cyber</button>
          <button class="tab"        id="tab-luxe"    onclick="switchTheme('luxe')">Luxe</button>
          <button class="tab"        id="tab-artisan" onclick="switchTheme('artisan')">Artisan</button>
        </div>
      </div>

      <div class="preview-wrapper">
        <a id="preview-link" href="https://vysites.com/cyber" class="preview-link" target="_blank">
          <img id="preview-img" src="./cyber.jpg" alt="Cyber Theme Preview" />
          <div id="preview-label" class="preview-label">Cyber Theme</div>
        </a>
      </div>

      <p class="hint">Click a tab to switch · Click the image to visit</p>

    </div>
  </div>

  <script>
    var themes = {
      cyber:   { img: './cyber.jpg',   label: 'Cyber Theme',   url: 'https://vysites.com/cyber' },
      luxe:    { img: './luxe.jpg',    label: 'Luxe Theme',    url: 'https://vysites.com/luxe' },
      artisan: { img: './artisan.jpg', label: 'Artisan Theme', url: 'https://vysites.com/artisan' }
    };

    function switchTheme(name) {
      var t = themes[name];
      document.getElementById('preview-img').src = t.img;
      document.getElementById('preview-img').alt = t.label + ' Preview';
      document.getElementById('preview-label').textContent = t.label;
      document.getElementById('preview-link').href = t.url;
      ['cyber', 'luxe', 'artisan'].forEach(function(id) {
        document.getElementById('tab-' + id).classList.toggle('active', id === name);
      });
    }
  </script>

</body>
</html>
