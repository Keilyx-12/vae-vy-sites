<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Website Builder | VY Sites</title>
  <!-- Browser Tab Logo -->
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
    }
    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d0d0d;
      border-bottom: 1px solid #222;
    }
    .header img {
      height: 35px;
      width: auto;
    }
    .form-container {
      height: calc(100vh - 60px);
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header with Logo -->
  <div class="header">
    <img src="/logo.png" alt="VY Sites Logo">
  </div>

  <!-- Builder Form Embed -->
  <div class="form-container">
    <!-- Replace YOUR_BUILDER_FORM_ID with your actual Fillout ID for Form 2 -->
    <div data-fillout-id="tmcgUSJSiCus" data-fillout-embed-type="fullscreen" style="width:100%;height:100%;" data-fillout-inherit-parameters></div>
    <script src="https://server.fillout.com/embed/v1/"></script>
  </div>

</body>
</html>
